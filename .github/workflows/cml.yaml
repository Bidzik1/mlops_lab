name: Model CI (Train, Test, Report)

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Format check (black)
        run: |
          black . --check

      - name: Prepare dataset
        run: python src/prepare.py --max-rows 5000

      - name: Run prepare tests
        run: pytest tests/test_prepare.py -q

      - name: Train
        env:
          CI: "true"
        run: python src/train.py

      - name: Run tests
        env:
          R2_THRESHOLD: "0.50"
          RMSE_THRESHOLD: "15000"
        run: |
          pytest tests/test_model.py -q

      - name: Create CML report (PR only)
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model Metrics" > report.md
          cat metrics.json >> report.md
          echo "" >> report.md
          echo "## Feature Importance" >> report.md
          cml publish feature_importance.png --md >> report.md
          cml comment create report.md